# Analyse automatique SonarCloud.
# Exclus de la détection de duplication seulement : le journal des changements
# de la politique (une entrée publiée par changement, immuable, toutes de même
# forme, FR et sa traduction EN rangée par identifiant). La détection normalise
# les littéraux : deux entrées de même forme y passent pour dupliquées
# (revue de #525). Le registre et les documents du bot n'en ont plus besoin :
# leurs deux langues s'écrivent une fois (`frEn`, docs/features/LEGAL_DATA_FILES.md).
# Analyse, bugs et sécurité restent actifs sur ces fichiers.
sonar.cpd.exclusions=lib/shared/privacy-changes.ts,lib/shared/privacy-changes-en.ts
