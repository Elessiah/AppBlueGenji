<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060a" />
    <title>Hors ligne — BlueGenji Esport</title>
    <!--
      Page servie par le service worker (`public/push-sw.js`) quand une
      navigation échoue faute de réseau. Statique et autonome : aucun script
      (la CSP n'en admet pas sans nonce), aucune police ni image à charger —
      il n'y a pas de réseau pour les chercher. Ne jamais y afficher une
      donnée du site : elle passerait pour à jour.
    -->
    <style>
      :root {
        --bg: #05060a;
        --ink: #e8f1f8;
        --ink-mute: #b8c7d4;
        --blue: #5ac8ff;
        --line: rgba(90, 200, 255, 0.28);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        padding: 32px 24px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(90, 200, 255, 0.04);
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 12px;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--blue);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.25;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.55;
        color: var(--ink-mute);
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 12px 20px;
        border-radius: 10px;
        background: var(--blue);
        color: #04121c;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
      @media (forced-colors: active) {
        a {
          border: 1px solid LinkText;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <p class="eyebrow">BlueGenji Esport</p>
        <h1>Pas de connexion</h1>
        <p>
          Le site n'a pas pu être joint. Vérifie ta connexion à Internet, puis réessaie : les tournois, les scores
          et les équipes ne s'affichent qu'en direct, jamais depuis une copie.
        </p>
        <a href="">Réessayer</a>
      </div>
    </main>
  </body>
</html>
