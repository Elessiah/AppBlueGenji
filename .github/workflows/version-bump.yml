# Bump de version à la fusion d'une PR dans main — voir docs/features/VERSIONING.md.
# Niveau lu sur les étiquettes de la PR : release:major, release:minor, sinon patch ;
# release:skip = aucun bump. Le commit de version porte [skip ci] et n'ouvre aucune PR,
# donc il ne relance ni ce workflow ni le CI.
#
# Déclenché par le push sur main (la fusion elle-même), pas par pull_request_target :
# le job tourne dans le contexte du dépôt, une PR venue d'un fork est versionnée comme
# les autres, et aucun déclencheur privilégié n'a l'occasion d'extraire le code d'une
# PR. La PR fusionnée est retrouvée par l'API à partir du commit poussé.
name: Version bump

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# Pas de groupe global : GitHub ne garde qu'une exécution en attente par groupe et
# annulerait les autres (un bump perdu sans erreur). Les fusions simultanées se
# départagent au push, qui recalcule la version sur main à jour à chaque essai.
concurrency:
  group: version-bump-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      # Un push direct sur main (sans PR) ne monte aucune version. Le lien
      # commit → PR peut apparaître quelques secondes après le push : trois essais.
      # Une erreur passagère de l'API est retentée elle aussi (le `if` évite que
      # `bash -e` n'arrête le pas) ; trois erreurs font échouer le job plutôt que
      # de perdre la version sans bruit.
      - name: Retrouver la PR fusionnée
        id: pr
        run: |
          pr=""
          api_failed=false
          for attempt in 1 2 3; do
            if pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty'); then
              api_failed=false
              [ -n "$pr" ] && break
            else
              api_failed=true
              pr=""
            fi
            sleep $((attempt * 5))
          done
          if [ -z "$pr" ] && [ "$api_failed" = "true" ]; then
            echo "::error::API GitHub injoignable : PR de $GITHUB_SHA introuvable."
            exit 1
          fi
          if [ -z "$pr" ]; then
            echo "Aucune PR fusionnée pour $GITHUB_SHA : pas de bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels=",$(jq -r '[.labels[].name] | join(",")' <<< "$pr"),"
          head_ref=$(jq -r '.head.ref' <<< "$pr")
          author=$(jq -r '.user.login' <<< "$pr")
          # Garde anti-boucle : release:skip, branches release/*, PR du bot.
          skip=false
          case "$labels" in *",release:skip,"*) skip=true ;; esac
          case "$head_ref" in release/*) skip=true ;; esac
          if [ "$author" = "github-actions[bot]" ]; then skip=true; fi
          if [[ "$labels" == *",release:major,"* ]]; then level=major
          elif [[ "$labels" == *",release:minor,"* ]]; then level=minor
          else level=patch
          fi
          {
            echo "skip=$skip"
            echo "number=$(jq -r '.number' <<< "$pr")"
            echo "level=$level"
          } >> "$GITHUB_OUTPUT"

      # Le push sur main est du code déjà fusionné ; on extrait tout de même main
      # à jour (pas le commit poussé) : une autre fusion a pu passer entre-temps.
      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip == 'false'
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        if: steps.pr.outputs.skip == 'false'
        with:
          node-version: '20'

      - name: Monter la version, commiter, taguer et pousser
        id: bump
        if: steps.pr.outputs.skip == 'false'
        env:
          LEVEL: ${{ steps.pr.outputs.level }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          marker="(#$PR_NUMBER) [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch --tags origin main
            git reset -q --hard origin/main
            # Relance après un échec partiel : la version de cette PR est déjà sur
            # main, on la reprend au lieu d'en monter une seconde.
            done_sha=$(git log -n 1 --format=%H --fixed-strings --grep="$marker" origin/main)
            if [ -n "$done_sha" ]; then
              version=$(git log -n 1 --format=%s "$done_sha" | awk '{print $2}')
              git rev-parse -q --verify "refs/tags/$version" >/dev/null || git tag "$version" "$done_sha"
              git push origin "refs/tags/$version"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            npm version "$LEVEL" --no-git-tag-version --ignore-scripts
            version="v$(node -p "require('./package.json').version")"
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "::error::Le tag $version existe déjà."
              exit 1
            fi
            git add package.json package-lock.json
            git commit -q -m "release $version $marker"
            git tag "$version"
            # Atomique : le commit et son tag arrivent ensemble ou pas du tout.
            if git push --atomic origin HEAD:main "refs/tags/$version"; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag -d "$version"
            sleep $((attempt * 5))
          done
          echo "::error::Push refusé cinq fois."
          exit 1

      - name: Publier la release
        if: steps.pr.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION déjà publiée."
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes --verify-tag
          fi
